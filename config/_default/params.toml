colorScheme = "mamba"             # custom scheme: assets/css/schemes/mamba.css (purple + gold)
defaultAppearance = "dark"
autoSwitchAppearance = false

enableSearch = true
enableCodeCopy = true
mainSections = ["posts"]

defaultBackgroundImage = "img/bg-default.jpg"
highlightCurrentMenuArea = true
smartTOC = true
fingerprintAlgorithm = "sha512"

[header]
  layout = "fixed-fill-blur"

[footer]
  showMenu = true
  showCopyright = true
  showThemeAttribution = false
  showAppearanceSwitcher = true
  showScrollToTop = true

[homepage]
  layout = "custom"                # layouts/partials/home/custom.html
  showRecent = true
  showRecentItems = 6
  showMoreLink = true
  showMoreLinkDest = "posts"
  cardView = true

[article]
  showDate = true
  showDateUpdated = true
  showAuthor = true
  showHero = true
  heroStyle = "background"
  layoutBackgroundBlur = true
  layoutBackgroundHeaderSpace = true
  showBreadcrumbs = true
  showDraftLabel = true
  showHeadingAnchors = true
  showPagination = true
  showReadingTime = true
  showTableOfContents = true
  showRelatedContent = true
  relatedContentLimit = 3
  showTaxonomies = true
  showZenMode = true
  sharingLinks = ["linkedin", "x-twitter", "reddit", "email"]

[list]
  showHero = true
  heroStyle = "background"
  showBreadcrumbs = false
  showSummary = true
  showTableOfContents = false
  groupByYear = true
  cardView = true

[taxonomy]
  showTermCount = true

[term]
  showHero = true
  heroStyle = "background"
  groupByYear = false
  cardView = true
